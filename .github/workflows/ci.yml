name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: libwitgo_bridge.so
          - runner: ubuntu-24.04-arm
            binary: libwitgo_bridge.so
          - runner: macos-15-intel
            binary: libwitgo_bridge.dylib
          - runner: macos-14
            binary: libwitgo_bridge.dylib
          - runner: windows-latest
            binary: witgo_bridge.dll
          - runner: windows-11-arm
            binary: witgo_bridge.dll
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.18.x'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Test Rust bridge
        working-directory: bridge
        run: cargo test --locked
      - name: Lint Rust bridge
        working-directory: bridge
        run: cargo clippy --locked -- -D warnings
      - name: Build Rust bridge
        working-directory: bridge
        run: cargo build --locked --lib
      - name: Test Go packages against current bridge
        env:
          WITGO_COMPONENT_LIBRARY: bridge/target/debug/${{ matrix.binary }}
          WITGO_DISABLE_EMBEDDED_BRIDGE: '1'
        run: go test ./...
      - name: Vet Go packages
        run: go vet ./...

  witgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.18.x'
          cache-dependency-path: |
            go.sum
            cmd/witgen/go.sum
      - run: go test ./...
        working-directory: cmd/witgen

  tinygo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          sudo dpkg -i tinygo_0.41.1_amd64.deb
      - name: Compile all Go packages with TinyGo
        env:
          CGO_ENABLED: '1'
        run: tinygo test ./... -run '^$'
      - name: Verify automatic WASM plugin role
        env:
          GOOS: wasip1
          GOARCH: wasm
          CGO_ENABLED: '0'
        run: go test -c -o /tmp/witgo-wasm-role.test .
      - name: Build bridge for TinyGo CGo backend
        working-directory: bridge
        run: cargo build --locked --lib
      - name: Run bridge handshake through TinyGo CGo backend
        env:
          CGO_ENABLED: '1'
          WITGO_COMPONENT_LIBRARY: bridge/target/debug/libwitgo_bridge.so
          WITGO_DISABLE_EMBEDDED_BRIDGE: '1'
        run: tinygo test . -run '^(TestTinyGoUsesCGoBridgeBackend|TestComponentVersionHandshake)$'
