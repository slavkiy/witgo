[package]
name = "witgo-component-host"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
name = "witgo_bridge"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
wasmtime = { version = "=47.0.2", default-features = false, features = ["anyhow", "component-model", "component-model-async", "cranelift", "runtime", "std", "wat"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
